[package]
name = "lingxi"
version = "0.1.0"
description = "灵犀桌面伴侣"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lingxi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Minimal local-only HTTP bridge so an external AI driver process can poll perception data
# and post movement suggestions (see packages/perception-contract). Sync and tiny on purpose -
# this app has no other need for an async runtime, and pulling in tokio/axum just for a
# handful of localhost-only JSON endpoints would be a large dependency for a small job.
tiny_http = "0.12"
# Global (screen-space) cursor position polling. The webview only sees mouse
# events over its own hit-tested surface, and click-through windows stop
# receiving those entirely - the mouse-follow behavior needs OS-level cursor
# position independent of window hit-testing.
#
# NOT device_query: its macOS mouse polling turned out to require Accessibility
# permission too (panics without it, verified empirically), which put up a
# real barrier to "just see the cat move" on first run. NSEvent.mouseLocation
# is a plain class property read - no event tap, no monitor, no entitlement -
# and needs no permission at all. macos-accessibility-client is kept only for
# the (currently unused) future case where a real global click/keystroke
# *listener* is needed, which is a materially different, permission-gated ask.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
macos-accessibility-client = "0.0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
