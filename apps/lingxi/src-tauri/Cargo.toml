[package]
name = "lingxi"
version = "0.3.0"
description = "灵犀桌面伴侣"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lingxi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Custom-asset PNGs are handed to the webview as data URLs rather than over a file:// path.
base64 = "0.22"
# Minimal local-only HTTP bridge so an external AI driver process can poll perception data
# and post movement suggestions (see packages/perception-contract). Sync and tiny on purpose -
# this app has no other need for an async runtime, and pulling in tokio/axum just for a
# handful of localhost-only JSON endpoints would be a large dependency for a small job.
tiny_http = "0.12"
# ~/.codex/config.toml belongs to the user, not to us: it holds their model settings, their
# other MCP servers and their own comments. toml_edit is the one that edits in place and gives
# all of that back byte-for-byte; a parse-and-reserialise round trip would silently strip every
# comment in the file as the price of adding six lines. It is what Cargo uses on Cargo.toml for
# the same reason.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# Global (screen-space) cursor position polling. The webview only sees mouse
# events over its own hit-tested surface, and click-through windows stop
# receiving those entirely - the mouse-follow behavior needs OS-level cursor
# position independent of window hit-testing.
#
# NOT device_query: its macOS mouse polling turned out to require Accessibility
# permission too (panics without it, verified empirically), which put up a
# real barrier to "just see the cat move" on first run. NSEvent.mouseLocation
# is a plain class property read - no event tap, no monitor, no entitlement -
# and needs no permission at all. macos-accessibility-client is kept only for
# the (currently unused) future case where a real global click/keystroke
# *listener* is needed, which is a materially different, permission-gated ask.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
macos-accessibility-client = "0.0.2"
# Power: the observer blocks for the display-sleep / lock / screen-saver notifications, and the
# CoreGraphics reads that double-check them (see watch_system_presence / revalidate_presence).
# Both already ship inside the app through tao/wry; listed here only so lib.rs can name them.
block2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "libc", "CGDirectDisplay", "CGDisplayConfiguration", "CGEventSource", "CGEventTypes", "CGSession"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
