<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵犀 · 皮肤与表情实验室</title><style>
#texture-drop{border:1px dashed #c9aa84;border-radius:16px;padding:16px;margin-bottom:24px;background:#fbf5eb}#texture-drop.dragging{background:#f1dcc0}#tile-size{width:140px}button:disabled{opacity:.5;cursor:default}.file:focus-visible{outline:2px solid #ac8153}*{box-sizing:border-box}body{margin:0;background:#f6f1e8;color:#473c33;font:14px system-ui}header{padding:28px 4vw 18px;display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:6px 0}small{letter-spacing:3px;color:#99826b}p{line-height:1.7;color:#857568}main{display:grid;grid-template-columns:1fr 350px;gap:24px;padding:0 4vw 32px}#stage{height:560px;border-radius:24px;overflow:hidden;background:#eee5d8}aside{background:#fffcf6;border:1px solid #e7ded0;border-radius:24px;padding:24px}h2{font-size:15px;margin:22px 0 12px}.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}button,.file{border:1px solid #e0d6c8;background:#fffcf7;color:#5c4d40;border-radius:12px;padding:10px 13px;cursor:pointer;font:inherit}button:hover,.file:hover{border-color:#ac8153}button[aria-pressed=true]{background:#f1dcc0;border-color:#bc8a50}#motions{max-height:230px;overflow:auto}#motion-progress{width:160px}#expressions{max-height:180px;overflow:auto;display:flex;flex-wrap:wrap;gap:6px}#expressions button{padding:7px 10px}#skins button{text-align:left;padding:16px}#skins strong{display:block;margin:10px 0 4px}.swatch{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:5px;border:1px solid #00000008}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}canvas{display:block}#face{width:150px;height:150px;margin:auto;background:#f2eadf;border-radius:18px}#status{font-size:12px;min-height:38px}select{padding:8px;border:1px solid #ded1c1;border-radius:8px;background:#fffaf2;color:inherit}.layer{display:flex;justify-content:space-between;margin:8px 0}input[type=file]{display:none}@media(max-width:900px){main{grid-template-columns:1fr}#stage{height:420px}.skins{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div><small>LINGXI / LITTLE COMPANIONS</small><h1>我在这里，看着你。</h1><p>安静站立 · 40 种猫咪动作 · 30 种表情 · 3 套部位专绘 PNG</p></div><span>皮肤与表情实验室 / 01</span></header><main><section><div id="stage"></div><div class="actions"><button id="rotate">旋转视角</button><button id="walk">散步</button><button id="front">面向我</button><button id="three">轻侧视角</button></div><div id="skins" class="skins"></div></section><aside><section id="texture-drop"><h2 style="margin-top:0">导入你的 PNG 皮肤</h2><p>照片、图案、像素画都可以。拖进来，或选择文件；无需专用展开图。</p><div class="actions"><label class="file" tabindex="0">选择 PNG<input id="import-png" type="file" accept="image/png,.json" multiple></label><label class="file" tabindex="0">导入 UV 配置<input id="import-config" type="file" accept=".json,application/json"></label></div><p>也可以同时选择 PNG 与配套 JSON。</p><label class="layer">覆盖方式<select id="texture-mode"><option value="tile">全身平铺</option><option value="cover">整图铺到每一面</option><option value="atlas">专用展开图</option></select></label><label class="layer">图案大小<input id="tile-size" type="range" min="0.25" max="64" step="0.25" value="8"></label><label class="layer">图像质感<select id="texture-filter"><option value="nearest">像素清晰</option><option value="linear">柔和照片</option></select></label><label class="layer">保留动态五官<input id="keep-face" type="checkbox" checked></label><button id="clear-config" disabled>清除部位 UV 配置</button><p id="status" role="status">未导入图片。支持任意长宽比例的 PNG。</p></section><canvas id="face" width="256" height="256"></canvas><h2 id="skin-name"></h2><p id="skin-description"></p><h2>现在的心情</h2><div id="expressions"></div><h2>猫咪动作库</h2><p id="motion-count"></p><label class="layer">动作分类<select id="motion-category"><option value="all">全部</option><option>互动</option><option>休息</option><option>清洁</option><option>玩耍</option><option>伸展</option><option>探索</option><option>尾巴</option></select></label><div id="motions" class="actions"></div><div class="actions"><button id="pause-motion">暂停动作</button><button id="stop-motion">回到站姿</button></div><label class="layer">动作进度<input id="motion-progress" type="range" min="0" max="1" step="0.01" value="0"></label><p id="motion-status" role="status">选择动作开始，可暂停查看姿势。</p><details><summary>自定义动作 JSON</summary><p>编辑各关节关键帧、时长与表情，再导入。支持完整身体、尾巴和清洁动作。</p><div class="actions"><label class="file">导入动作<input id="import-motion" type="file" accept=".json"></label><button id="export-motion">保存动作配置</button></div></details><h2>自由组合五官</h2><div id="layers"></div><h2>保存当前素材（可选）</h2><div class="actions"><button id="export-png">毛色 PNG</button><button id="export-face">表情 PNG</button><button id="export-json">皮肤 JSON</button></div></aside></main><script type="module" src="/src/style-lab/main.ts"></script></body></html>
