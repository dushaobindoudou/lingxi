<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- WorkBuddy brand mark (com.tencent.workbuddy.mac). Redrawn as a vector from the app's own
       icon (icon.icns): teal gradient tile, tilted white cat head, rounded face panel, two pill
       eyes. Self-coloured, safe as <img> - see apps/lingxi/src/ui/icons.ts.
       注：注释必须放在 <svg> 里面。应用的 logo 校验要求文件【以 "<svg" 开头】，
       前面顶一段注释会被判成 "not an SVG document"，register 返回 400，
       安装器 set -e 就在第 4 步中断——hooks 永远装不上，而且没有任何报错。 -->
  <defs>
    <linearGradient id="wb-bg" x1="0.25" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0DC8A6"/>
      <stop offset="1" stop-color="#02C889"/>
    </linearGradient>
    <linearGradient id="wb-head" x1="0.9" y1="0.1" x2="0.1" y2="0.95">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5F4E9"/>
    </linearGradient>
    <linearGradient id="wb-face" x1="0.85" y1="0.05" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0CC894"/>
      <stop offset="1" stop-color="#66D373"/>
    </linearGradient>
    <clipPath id="wb-tile"><rect width="64" height="64" rx="14.5"/></clipPath>
  </defs>
  <g clip-path="url(#wb-tile)">
    <rect width="64" height="64" fill="url(#wb-bg)"/>
    <g transform="rotate(-19 32 32)">
      <path fill="url(#wb-head)" d="M 54.5 8
        C 51 11.3, 47 14.6, 45.1 18.6
        C 36 22.4, 20 22.6, 9 23.2
        C 5.5 22.4, 3.6 21, 3.5 24.5
        C 3.4 30.5, 3.6 36.5, 4.3 43
        C 3.4 46.5, 0.8 48.4, -0.3 50.6
        C -1.3 52.6, -0.2 55, 2.4 56.6
        C 8 62.5, 16 67, 26 68.8
        C 34 70.2, 44 70, 51.5 67.5
        C 58 65, 63 57, 64.8 48
        C 66.2 41.5, 66 35.5, 64.2 30.5
        C 62.8 26.6, 60.6 21.9, 59.1 18.5
        C 57.8 15.3, 56 12, 54.5 8 Z"/>
      <rect x="10.6" y="30.7" width="51.7" height="33.7" rx="16.9" fill="url(#wb-face)"/>
      <rect x="22.5" y="43.2" width="7.2" height="12.2" rx="3.8" fill="#FFFFFF"/>
      <rect x="41.3" y="40.4" width="7" height="12.2" rx="3.8" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
