    <text x="38" y="341" fill="#655B51" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="13">外观</text>
    <text x="38" y="383" fill="#655B51" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="13">设置</text>
    <path d="M20 778H198" stroke="#E5D9CA"/>
