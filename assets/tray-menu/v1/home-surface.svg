    <text x="450" y="635" fill="#72675C" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="12">Codex 正在工作</text>
    <circle cx="600" cy="630" r="4" fill="#A99C8E"/>
    <text x="613" y="635" fill="#72675C" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="12">Claude 未连接</text>
    <text x="1158" y="635" text-anchor="end" fill="#936746" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="12">查看详情 →</text>

