    <text x="246" y="607" fill="#423A33" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="14" font-weight="600">一起度过的今天</text>
    <text x="246" y="635" fill="#72675C" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="12">3 小时 12 分</text>
    <path d="M410 602V641" stroke="#E5D9CA"/>
